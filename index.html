<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>toutou - Catalogue</title>

  <meta name="description" content="Boutique toutou - Commandez en ligne" />
  <meta property="og:title" content="toutou - Catalogue" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mekeirish.github.io/hanout-toutou/" />
  <meta property="og:description" content="Boutique toutou - Commandez en ligne" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    /* =========================================================
       THÈME (les couleurs d'accent sont modifiées par la boutique)
       ========================================================= */
    :root {
      --accent: #0f766e;
      --accent-2: #115e59;
      --accent-ink: #ffffff;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --chip-bg: rgba(255, 255, 255, 0.2);

      --bg: #f6f8f7;
      --surface: #ffffff;
      --surface-2: #e9efec;
      --ink: #14211c;
      --ink-2: #4b5d56;
      --ink-3: #82938c;
      --line: #e1e8e4;

      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --warn: #d97706;
      --ok: #059669;
      --shadow: 0 1px 2px rgba(20, 33, 28, 0.05), 0 8px 22px rgba(20, 33, 28, 0.08);

      --hdr: 56px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #2dd4bf;
        --accent-2: #14b8a6;
        --accent-ink: #062a26;
        --accent-soft: rgba(45, 212, 191, 0.15);
        --bg: #0b1512;
        --surface: #121f1b;
        --surface-2: #1a2c26;
        --ink: #eef5f2;
        --ink-2: #b2c3bb;
        --ink-3: #7b8e86;
        --line: #223630;
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.14);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
      }
    }

    /* =========================================================
       BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button[disabled] { cursor: not-allowed; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin: 0; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .boot { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

    .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 16px; }

    /* =========================================================
       BOUTONS
       ========================================================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; padding: 0 18px; border-radius: 13px;
      font-weight: 600; font-size: 15px; white-space: nowrap;
      transition: transform 0.1s, opacity 0.2s, background 0.2s;
      text-decoration: none;
    }
    .btn:active:not([disabled]) { transform: scale(0.98); }
    .btn[disabled] { opacity: 0.5; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-soft { background: var(--accent-soft); color: var(--accent); }
    .btn-ghost { background: var(--surface-2); color: var(--ink); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-block { width: 100%; }
    .btn-sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
    .link-btn { color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 0; min-height: 40px; }

    .icon-btn {
      position: relative; flex: none; width: 44px; height: 44px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
    }
    .icon-btn:active { background: var(--surface-2); }
    .icon-btn.sm { width: 40px; height: 40px; }
    .icon-btn.danger { color: var(--danger); }
    .badge {
      position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px; background: var(--danger); color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    }

    /* =========================================================
       EN-TÊTE (hauteur fixe : jamais de retour à la ligne)
       ========================================================= */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding-top: var(--safe-top);
    }
    .topbar-in {
      height: var(--hdr); max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px;
    }
    /* Dans SOG, le bouton « Retour » est posé par-dessus l'iframe (haut-gauche) :
       on lui réserve la place pour qu'il ne cache rien. */
    .in-frame .topbar-in { padding-left: 116px; }
    .in-frame .brand-mark { display: none; }
    .brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px; flex: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
    }
    .brand-name { font-weight: 800; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* =========================================================
       ACCUEIL
       ========================================================= */
    .hero { padding: 16px 0 4px; }
    .hero-card { border-radius: 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .hero-title { font-size: 18px; font-weight: 800; line-height: 1.25; }
    .hero-sub { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
    .hero-chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .hero-chip {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 28px; padding: 0 12px; border-radius: 14px;
      background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
    }

    .search { position: relative; margin-top: 12px; }
    .search input {
      width: 100%; height: 48px; padding: 0 44px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--surface); font-size: 16px;
    }
    .search input { -webkit-appearance: none; appearance: none; }
    .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
    .search .s-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; display: flex; }
    .search .s-clear { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }

    .chips-wrap {
      position: sticky; top: calc(var(--hdr) + var(--safe-top)); z-index: 20;
      background: var(--bg); padding: 10px 0 8px;
    }
    .chips {
      max-width: 1100px; margin: 0 auto; padding: 2px 16px;
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; height: 40px; padding: 0 16px; border-radius: 19px;
      background: var(--surface); border: 1px solid var(--line);
      font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    .page { padding-top: 4px; min-height: 50vh; }
    .page.has-dock { padding-bottom: calc(92px + var(--safe-bottom)); }
    .section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); margin: 12px 0 8px; }

    /* =========================================================
       GRILLE PRODUITS
       ========================================================= */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 4px 0 20px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
    @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    .card { background: var(--surface); border: 0; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); }
    .card-img { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; background: var(--surface-2); overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .ribbon { position: absolute; left: 8px; top: 8px; padding: 4px 10px; border-radius: 10px; background: rgba(8, 20, 15, 0.78); color: #fff; font-size: 12px; font-weight: 700; }
    .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .card-cat { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-name {
      cursor: pointer; font-size: 15px; font-weight: 600; line-height: 1.3; min-height: 2.6em;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
    }
    .price { font-weight: 800; font-size: 16px; }
    .stock-note { font-size: 12px; color: var(--ink-3); }
    .stock-note.low { color: var(--warn); font-weight: 600; }
    .card-act { margin-top: auto; padding-top: 8px; }

    .stepper { display: flex; align-items: center; justify-content: space-between; height: 44px; border-radius: 13px; background: var(--accent-soft); }
    .stepper button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--accent); border-radius: 12px; }
    .stepper button[disabled] { opacity: 0.35; }
    .stepper .q { min-width: 28px; text-align: center; font-weight: 700; }
    .stepper.sm { height: 40px; display: inline-flex; }
    .stepper.sm button { width: 40px; height: 40px; }

    .empty { text-align: center; padding: 48px 16px; color: var(--ink-2); }
    .empty .e-ico { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; background: var(--surface-2); color: var(--ink-3); display: flex; align-items: center; justify-content: center; }
    .empty h3 { font-size: 17px; color: var(--ink); margin-bottom: 4px; }

    .skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 12px; }
    .skel-card { border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
    .skel-card .skel { border-radius: 0; aspect-ratio: 1 / 1; }
    .skel-line { height: 12px; margin: 12px 12px 0; }
    .skel-line.s { width: 40%; margin-bottom: 14px; }

    .footer { text-align: center; font-size: 12px; color: var(--ink-3); padding: 12px 0 28px; }

    /* =========================================================
       BARRE BASSE (panier / sauvegarde)
       ========================================================= */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0 12px calc(12px + var(--safe-bottom)); display: flex; justify-content: center; pointer-events: none; }
    .dock-btn {
      pointer-events: auto; width: 100%; max-width: 560px; height: 56px; padding: 0 18px; border-radius: 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px;
      box-shadow: 0 10px 28px rgba(8, 20, 15, 0.28);
    }
    .dock-btn[disabled] { opacity: 0.6; }
    .dock-l { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .toasts { position: fixed; left: 0; right: 0; z-index: 70; display: flex; justify-content: center; padding: 0 12px; pointer-events: none; }
    .toast { pointer-events: auto; max-width: 520px; padding: 12px 16px; border-radius: 14px; background: #14211c; color: #fff; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); animation: up 0.2s ease-out; }
    .toast.success { background: #065f46; }
    .toast.error { background: #991b1b; }

    /* =========================================================
       FEUILLES (panier, produit, formulaires) : jamais coupées
       ========================================================= */
    .overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; background: rgba(8, 20, 15, 0.55); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.2s; }
    .overlay.center { align-items: center; padding: 20px; z-index: 80; }
    .sheet {
      width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh;
      background: var(--surface); border-radius: 22px 22px 0 0;
      display: flex; flex-direction: column; overflow: hidden; animation: up 0.25s ease-out;
    }
    .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 20px; border-bottom: 1px solid var(--line); min-height: 56px; }
    .sheet-title { font-size: 18px; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px 20px; }
    .sheet-foot { flex: none; padding: 12px 20px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
    @media (min-width: 640px) {
      .overlay { align-items: center; padding: 24px; }
      .sheet { border-radius: 22px; max-height: 90vh; max-height: 90dvh; }
    }
    /* Dans SOG : on garde le haut libre pour le bouton « Retour » de l'application */
    .in-frame .sheet { max-height: calc(100vh - 64px); max-height: calc(100dvh - 64px); }
    .dialog { width: 100%; max-width: 400px; background: var(--surface); border-radius: 22px; padding: 20px; animation: up 0.2s ease-out; }
    .dialog h3 { font-size: 18px; margin-bottom: 8px; }
    .dialog p { color: var(--ink-2); font-size: 15px; }
    .dialog .d-act { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Détail produit */
    .pd-img { width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; object-fit: cover; background: var(--surface-2); }
    .pd-cat { margin-top: 14px; display: inline-block; padding: 4px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
    .pd-name { margin-top: 8px; font-size: 22px; font-weight: 800; line-height: 1.25; word-break: break-word; }
    .pd-price { margin-top: 4px; font-size: 22px; font-weight: 800; color: var(--accent); }
    .pd-desc { margin-top: 12px; color: var(--ink-2); white-space: pre-line; word-break: break-word; }
    .pd-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }

    /* Panier */
    .line { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .line:first-child { padding-top: 0; }
    .line-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--surface-2); }
    .line-name { font-weight: 600; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .line-unit { font-size: 13px; color: var(--ink-3); }
    .line-bot { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .line-total { font-weight: 700; white-space: nowrap; }
    .total-row { display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 800; margin-bottom: 10px; }
    .done { text-align: center; padding: 24px 0; }
    .done .d-ico { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; background: rgba(5, 150, 105, 0.12); color: var(--ok); display: flex; align-items: center; justify-content: center; }
    .done h3 { font-size: 20px; margin-bottom: 6px; }
    .done p { color: var(--ink-2); }

    /* Formulaires */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .input {
      width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--surface); font-size: 16px;
    }
    textarea.input { padding: 12px 14px; min-height: 88px; resize: vertical; }
    select.input { appearance: auto; }
    .input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    .hint { font-size: 12px; color: var(--ink-3); }
    .note { padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; }
    .note.err { background: var(--danger-soft); color: var(--danger); }
    .note.info { background: var(--accent-soft); color: var(--accent); }
    .note.warn { background: rgba(217, 119, 6, 0.12); color: var(--warn); }
    .pw { position: relative; }
    .pw .input { padding-right: 52px; }
    .pw button { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
    .imgfield { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; }
    .imgfield .pv { width: 96px; height: 96px; border-radius: 14px; object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); }
    .imgfield .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
    .switch input { width: 48px; height: 28px; accent-color: var(--accent); }
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
    .swatch.on { box-shadow: 0 0 0 3px var(--ink); }
    .color-input { width: 44px; height: 44px; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; -webkit-appearance: none; appearance: none; }
    .color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-input::-webkit-color-swatch { border: 3px solid var(--surface); border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
    .color-input::-moz-color-swatch { border: 3px solid var(--surface); border-radius: 50%; }

    /* Administration */
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px; }
    .seg button { min-height: 40px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
    .panel h3 { font-size: 16px; margin-bottom: 12px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 12px; }
    .bar b { font-size: 15px; }
    .rows { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
    .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
    .row.cat { grid-template-columns: minmax(0, 1fr) auto; padding-left: 14px; }
    .row.dirty { border-color: var(--warn); }
    .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--surface-2); }
    .row-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 8px; background: rgba(217, 119, 6, 0.14); color: var(--warn); font-size: 11px; font-weight: 700; vertical-align: middle; }
    .row-actions { display: flex; gap: 2px; }
  </style>
</head>
<body>
<div id="root"><div class="boot"><div class="spinner"></div></div></div>
<noscript><p style="padding:24px;font-family:sans-serif">Cette boutique nécessite JavaScript.</p></noscript>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // =========================================================
  // CONFIGURATION
  // =========================================================
  var GITHUB_OWNER = "mekeirish";
  var SOG_URL = "https://mekeirish.github.io/SOG/";
  var CLOUDINARY_CFG = { cloudName: "h91be5lz", uploadPreset: "hanout_upload", folder: "hanout_products" };

  var firebaseConfig = {
    apiKey: "AIzaSyCegKjHSw2DzF1zcBVdG6iZyGK2P3ig1rM",
    authDomain: "sog-hanout.firebaseapp.com",
    projectId: "sog-hanout",
    storageBucket: "sog-hanout.firebasestorage.app",
    messagingSenderId: "108437302312",
    appId: "1:108437302312:web:9faa1f7084e5797cf9591d",
    measurementId: "G-V1VFE9YDE3",
    databaseURL: "https://sog-hanout-default-rtdb.europe-west1.firebasedatabase.app/"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.database();

  // La boutique est-elle affichée dans l'iframe de SOG ?
  var IN_FRAME = (function () { try { return window.parent !== window; } catch (e) { return true; } })();

  // Catalogue de démonstration (affiché seulement sur le dépôt template lui-même)
  var DEMO_RAW = {
    settings: { title: "Boutique démo", tagline: "Aperçu du template : voici le rendu de votre boutique.", currency: "DZD", showStock: true, accent: "#0f766e", ntfyTopic: "" },
    categories: [{ id: 1, name: "Épicerie" }, { id: 2, name: "Boissons" }, { id: 3, name: "Fraîcheur" }],
    products: [
      { id: 1, name: "Huile d'olive extra vierge 1 L", price: 1250, image: "", categoryId: 1, stock: 12, description: "Pressée à froid.\nBouteille en verre de 1 litre." },
      { id: 2, name: "Café moulu 250 g", price: 690, image: "", categoryId: 1, stock: 4, description: "" },
      { id: 3, name: "Eau minérale 1,5 L", price: 45, image: "", categoryId: 2, stock: 80, description: "" },
      { id: 4, name: "Jus d'orange 1 L", price: 310, image: "", categoryId: 2, stock: 0, description: "" },
      { id: 5, name: "Tomates (kg)", price: 120, image: "", categoryId: 3, stock: null, description: "Prix au kilo." },
      { id: 6, name: "Fromage frais artisanal avec un nom très long pour tester", price: 480, image: "", categoryId: 3, stock: 9, description: "" }
    ]
  };

  // =========================================================
  // UTILITAIRES
  // =========================================================
  // Répare les textes déjà corrompus (« Ã© » au lieu de « é » : UTF-8 lu comme Latin-1).
  var fixMojibake = function (str) {
    str = String(str);
    if (!/[ÃÂâ][\u0080-\u00BF€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ]/.test(str)) return str;
    try { return decodeURIComponent(escape(str)); } catch (e) { return str; }
  };
  var decodeEntities = function (str) {
    if (!str) return "";
    try { var t = document.createElement("textarea"); t.innerHTML = String(str); return fixMojibake(t.value); } catch (e) { return fixMojibake(str); }
  };
  var lsGet = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var lsSet = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var utf8ToBase64 = function (s) { return btoa(unescape(encodeURIComponent(s))); };
  var base64ToUtf8 = function (s) { try { return decodeURIComponent(escape(atob(String(s).replace(/\s/g, "")))); } catch (e) { return ""; } };
  var fold = function (s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); };

  var safeUrl = function (u) {
    u = String(u || "").trim();
    return /^(https?:\/\/|data:image\/|\.\/|\/)/i.test(u) ? u : "";
  };
  var formatMoney = function (n, cur) {
    var v = Number(n) || 0;
    var s = v.toLocaleString("fr-FR", { minimumFractionDigits: v % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
    return s + " " + (cur || "");
  };
  // Images Cloudinary : version légère et automatique (WebP/AVIF) pour le mobile
  var optimizeImg = function (url, w) {
    if (!w || url.indexOf("res.cloudinary.com") === -1) return url;
    return url.replace(/\/upload\/(v\d+\/)/, "/upload/f_auto,q_auto,w_" + w + ",c_limit/$1");
  };
  var PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#e3ebe7"/>' +
    '<g fill="none" stroke="#8aa299" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M70 80l-12 16v52a8 8 0 008 8h68a8 8 0 008-8V96l-12-16z"/><path d="M58 96h84"/><path d="M122 114a22 22 0 01-44 0"/></g></svg>'
  );

  // Couleurs d'accent
  var hexToRgb = function (hex) {
    var h = hex.replace("#", "");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  var rgbToHex = function (c) {
    return "#" + c.map(function (v) { return ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2); }).join("");
  };
  var luminance = function (hex) {
    var c = hexToRgb(hex).map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  var applyTheme = function (accent) {
    var root = document.documentElement.style;
    var rgb = hexToRgb(accent);
    var light = luminance(accent) > 0.25;
    root.setProperty("--accent", accent);
    root.setProperty("--accent-2", rgbToHex(rgb.map(function (v) { return v * 0.72; })));
    root.setProperty("--accent-ink", light ? "#0f172a" : "#ffffff");
    root.setProperty("--accent-soft", "rgba(" + rgb.join(",") + ",0.13)");
    root.setProperty("--chip-bg", light ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.20)");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", accent);
  };

  // Catalogue : normalisation (tolère les anciens fichiers don.json)
  var parseStock = function (v) {
    if (v === undefined || v === null || v === "") return null;
    var n = Number(v);
    return isNaN(n) ? null : Math.max(0, Math.floor(n));
  };
  var normalizeCatalog = function (raw, vendeur) {
    raw = raw || {};
    var s = raw.settings || {};
    return {
      settings: {
        title: decodeEntities(s.title || ("Boutique de " + vendeur)),
        tagline: decodeEntities(s.tagline || ""),
        currency: decodeEntities(s.currency || "DZD"),
        accent: /^#[0-9a-f]{6}$/i.test(s.accent || "") ? s.accent : "#0f766e",
        logo: safeUrl(s.logo),
        showStock: s.showStock === undefined ? true : !!s.showStock,
        ntfyTopic: String(s.ntfyTopic === undefined ? vendeur + "_commandes" : s.ntfyTopic || "")
      },
      categories: (Array.isArray(raw.categories) ? raw.categories : []).map(function (c) {
        return { id: Number(c.id), name: decodeEntities(c.name || "") };
      }),
      products: (Array.isArray(raw.products) ? raw.products : []).map(function (p) {
        return {
          id: Number(p.id),
          name: decodeEntities(p.name || ""),
          price: Number(p.price) || 0,
          image: safeUrl(p.image),
          categoryId: Number(p.categoryId) || 0,
          stock: parseStock(p.stock),
          description: decodeEntities(p.description || "")
        };
      })
    };
  };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var isSoldOut = function (p) { return p.stock !== null && p.stock <= 0; };
  var maxQty = function (p) { return p.stock === null ? 99 : p.stock; };

  var countChanges = function (a, b) {
    if (!a || !b) return 0;
    var n = 0;
    var byId = function (list) { var m = {}; list.forEach(function (x) { m[x.id] = JSON.stringify(x); }); return m; };
    ["products", "categories"].forEach(function (k) {
      var A = byId(a[k]), B = byId(b[k]);
      Object.keys(B).forEach(function (id) { if (A[id] !== B[id]) n++; });
      Object.keys(A).forEach(function (id) { if (B[id] === undefined) n++; });
    });
    if (JSON.stringify(a.settings) !== JSON.stringify(b.settings)) n++;
    return n;
  };

  // GitHub : lecture / écriture du catalogue (don.json)
  var apiUrl = function (repo) { return "https://api.github.com/repos/" + GITHUB_OWNER + "/" + repo + "/contents/don.json"; };
  var fetchCatalog = async function (repo, token) {
    if (!token) {
      // 1) Depuis le site (rapide, sans quota GitHub)
      try {
        var r = await fetch("./don.json?v=" + Date.now(), { cache: "no-store" });
        if (r.ok) return { status: "ok", json: await r.json() };
      } catch (e) {}
    }
    // 2) API GitHub (contenu le plus récent)
    try {
      var headers = token ? { Authorization: "token " + token } : {};
      var res = await fetch(apiUrl(repo) + "?ref=main&t=" + Date.now(), { headers: headers });
      if (res.status === 404) return { status: "empty" };
      if (res.ok) {
        var d = await res.json();
        return { status: "ok", json: JSON.parse(base64ToUtf8(d.content)) };
      }
      return { status: "error", message: "GitHub " + res.status };
    } catch (e) {
      return { status: "error", message: e.message };
    }
  };
  var serializeCatalog = function (c) {
    return {
      settings: {
        title: c.settings.title, tagline: c.settings.tagline, currency: c.settings.currency,
        accent: c.settings.accent, logo: c.settings.logo, showStock: c.settings.showStock, ntfyTopic: c.settings.ntfyTopic
      },
      categories: c.categories.map(function (x) { return { id: x.id, name: x.name }; }),
      products: c.products.map(function (p) {
        return { id: p.id, name: p.name, price: p.price, image: p.image, categoryId: p.categoryId, stock: p.stock, description: p.description };
      })
    };
  };
  var githubSave = async function (repo, token, content) {
    var url = apiUrl(repo);
    var headers = { Authorization: "token " + token };
    var sha = null;
    var g = await fetch(url + "?ref=main&t=" + Date.now(), { headers: headers });
    if (g.ok) sha = (await g.json()).sha;
    else if (g.status === 401 || g.status === 403) throw new Error("token refusé (" + g.status + "). Vérifiez ses droits sur ce dépôt.");
    else if (g.status !== 404) throw new Error("GitHub " + g.status);
    var body = { message: "Mise à jour du catalogue", content: utf8ToBase64(JSON.stringify(content, null, 2)), branch: "main" };
    if (sha) body.sha = sha;
    var put = await fetch(url, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, headers),
      body: JSON.stringify(body)
    });
    if (!put.ok) {
      var e = {};
      try { e = await put.json(); } catch (x) {}
      throw new Error("GitHub " + put.status + (e.message ? " : " + e.message : ""));
    }
  };

  // Cloudinary : chargé seulement quand le vendeur téléverse une image
  var cloudinaryPromise = null;
  var loadCloudinary = function () {
    if (window.cloudinary) return Promise.resolve(window.cloudinary);
    if (!cloudinaryPromise) {
      cloudinaryPromise = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = "https://widget.cloudinary.com/v2.0/global/all.js";
        s.onload = function () { resolve(window.cloudinary); };
        s.onerror = function () { cloudinaryPromise = null; reject(new Error("cloudinary")); };
        document.head.appendChild(s);
      });
    }
    return cloudinaryPromise;
  };
  var openUpload = function (onUrl, onError) {
    loadCloudinary().then(function (cl) {
      var widget = cl.createUploadWidget({
        cloudName: CLOUDINARY_CFG.cloudName,
        uploadPreset: CLOUDINARY_CFG.uploadPreset,
        folder: CLOUDINARY_CFG.folder,
        sources: ["local", "url", "camera"],
        multiple: false,
        maxFiles: 1,
        resourceType: "image",
        clientAllowedFormats: ["jpg", "jpeg", "png", "gif", "webp"],
        maxImageFileSize: 5000000,
        language: "fr",
        text: { fr: { queue: { title: "Image", title_uploading_with_counter: "Envoi en cours…" } } }
      }, function (error, result) {
        if (error) { onError("Le téléversement a échoué."); return; }
        if (result && result.event === "success") onUrl(result.info.secure_url);
      });
      widget.open();
    }).catch(function () { onError("Impossible de charger l'outil d'images."); });
  };

  // =========================================================
  // ICÔNES
  // =========================================================
  var ICONS = {
    bag: "M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z M3 6h18 M16 10a4 4 0 01-8 0",
    search: "M11 19a8 8 0 100-16 8 8 0 000 16z M21 21l-4.35-4.35",
    plus: "M12 5v14 M5 12h14",
    minus: "M5 12h14",
    x: "M18 6L6 18 M6 6l12 12",
    trash: "M3 6h18 M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6 M10 11v6 M14 11v6 M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2",
    edit: "M12 20h9 M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z",
    lock: "M5 11h14v10H5z M8 11V7a4 4 0 018 0v4",
    sliders: "M4 21v-7 M4 10V3 M12 21v-9 M12 8V3 M20 21v-5 M20 12V3 M1 14h6 M9 8h6 M17 16h6",
    image: "M3 5a2 2 0 012-2h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2z M8.5 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3z M21 15l-5-5L5 21",
    check: "M20 6L9 17l-5-5",
    eye: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z M12 15a3 3 0 100-6 3 3 0 000 6z",
    eyeoff: "M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94 M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19 M1 1l22 22",
    logout: "M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9",
    back: "M19 12H5 M12 19l-7-7 7-7",
    alert: "M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"
  };
  function Icon(p) {
    var s = p.size || 22;
    return (
      <svg viewBox="0 0 24 24" width={s} height={s} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <path d={ICONS[p.name]} />
      </svg>
    );
  }

  // =========================================================
  // PETITS COMPOSANTS
  // =========================================================
  function Img(p) {
    var src = p.src ? optimizeImg(p.src, p.w) : PLACEHOLDER;
    return (
      <img
        src={src} alt={p.alt || ""} className={p.className}
        loading={p.eager ? "eager" : "lazy"} decoding="async"
        onError={function (e) { if (!e.target.dataset.fb) { e.target.dataset.fb = "1"; e.target.src = PLACEHOLDER; } }}
      />
    );
  }

  function Stepper(p) {
    var cls = "stepper" + (p.small ? " sm" : "");
    return (
      <div className={cls}>
        <button type="button" aria-label="Retirer un" onClick={p.onDec}><Icon name="minus" size={18} /></button>
        <span className="q" aria-live="polite">{p.qty}</span>
        <button type="button" aria-label="Ajouter un" onClick={p.onInc} disabled={p.qty >= p.max}><Icon name="plus" size={18} /></button>
      </div>
    );
  }

  function Sheet(p) {
    useEffect(function () {
      var onKey = function (e) { if (e.key === "Escape") p.onClose(); };
      document.addEventListener("keydown", onKey);
      return function () { document.removeEventListener("keydown", onKey); };
    });
    return (
      <div className="overlay" onMouseDown={function (e) { if (e.target === e.currentTarget) p.onClose(); }}>
        <div className="sheet" role="dialog" aria-modal="true" aria-label={p.title}>
          <div className="sheet-head">
            <h2 className="sheet-title">{p.title}</h2>
            <button type="button" className="icon-btn" aria-label="Fermer" onClick={p.onClose}><Icon name="x" /></button>
          </div>
          <div className="sheet-body">{p.children}</div>
          {p.footer ? <div className="sheet-foot">{p.footer}</div> : null}
        </div>
      </div>
    );
  }

  function Confirm(p) {
    return (
      <div className="overlay center" onMouseDown={function (e) { if (e.target === e.currentTarget) p.onNo(); }}>
        <div className="dialog" role="alertdialog" aria-modal="true">
          <h3>{p.title}</h3>
          <p>{p.text}</p>
          <div className="d-act">
            <button type="button" className="btn btn-ghost" onClick={p.onNo}>{p.noLabel || "Annuler"}</button>
            <button type="button" className={"btn " + (p.danger ? "btn-danger" : "btn-primary")} onClick={p.onYes}>{p.yesLabel || "Confirmer"}</button>
          </div>
        </div>
      </div>
    );
  }

  function Field(p) {
    return (
      <div className="field">
        <label className="label" htmlFor={p.id}>{p.label}</label>
        {p.children}
        {p.hint ? <div className="hint">{p.hint}</div> : null}
      </div>
    );
  }

  function Empty(p) {
    return (
      <div className="empty">
        <div className="e-ico"><Icon name={p.icon || "bag"} size={30} /></div>
        <h3>{p.title}</h3>
        {p.text ? <p>{p.text}</p> : null}
        {p.action ? <div style={{ marginTop: 16 }}>{p.action}</div> : null}
      </div>
    );
  }

  function ImageField(p) {
    var onErr = function (m) { p.onError(m); };
    return (
      <div className="imgfield">
        <Img className="pv" src={p.value} alt="Aperçu" w={200} eager />
        <div className="col">
          <button type="button" className="btn btn-soft btn-sm" onClick={function () { openUpload(p.onChange, onErr); }}>
            <Icon name="image" size={18} /> {p.value ? "Changer l'image" : "Ajouter une image"}
          </button>
          <input className="input" style={{ minHeight: 40 }} type="url" inputMode="url" placeholder="ou coller une adresse https://…" value={p.value} onChange={function (e) { p.onChange(e.target.value.trim()); }} />
          {p.value ? <button type="button" className="link-btn" style={{ textAlign: "left" }} onClick={function () { p.onChange(""); }}>Retirer l'image</button> : null}
        </div>
      </div>
    );
  }

  // =========================================================
  // BOUTIQUE (client)
  // =========================================================
  function ProductCard(p) {
    var item = p.item;
    var soldOut = isSoldOut(item);
    var low = item.stock !== null && item.stock > 0 && item.stock <= 5;
    var open = function () { p.onOpen(item.id); };
    var stockText = null;
    if (low) stockText = "Plus que " + item.stock + " en stock";
    else if (p.showStock && item.stock !== null && !soldOut) stockText = "Stock : " + item.stock;
    return (
      <article className="card">
        <button type="button" className="card-img" onClick={open} aria-label={"Voir " + item.name}>
          <Img src={item.image} w={480} />
          {soldOut ? <span className="ribbon">Rupture</span> : null}
        </button>
        <div className="card-body">
          {p.catName ? <div className="card-cat">{p.catName}</div> : null}
          <h3 className="card-name" onClick={open}>{item.name}</h3>
          <div className="price">{formatMoney(item.price, p.currency)}</div>
          {stockText ? <div className={"stock-note" + (low ? " low" : "")}>{stockText}</div> : null}
          <div className="card-act">
            {soldOut ? (
              <button type="button" className="btn btn-ghost btn-block" disabled>Indisponible</button>
            ) : p.qty > 0 ? (
              <Stepper qty={p.qty} max={maxQty(item)} onDec={function () { p.onQty(item, p.qty - 1); }} onInc={function () { p.onQty(item, p.qty + 1); }} />
            ) : (
              <button type="button" className="btn btn-primary btn-block" onClick={function () { p.onQty(item, 1); }}>
                <Icon name="plus" size={18} /> Ajouter
              </button>
            )}
          </div>
        </div>
      </article>
    );
  }

  function ProductSheet(p) {
    var item = p.item;
    var [qty, setQty] = useState(p.inCart > 0 ? p.inCart : 1);
    var max = Math.max(1, maxQty(item));
    var soldOut = isSoldOut(item);
    var footer = soldOut ? (
      <button type="button" className="btn btn-ghost btn-block" disabled>Produit indisponible</button>
    ) : (
      <div>
        <div className="pd-row">
          <Stepper qty={qty} max={max} onDec={function () { setQty(Math.max(1, qty - 1)); }} onInc={function () { setQty(Math.min(max, qty + 1)); }} />
          <b>{formatMoney(item.price * qty, p.currency)}</b>
        </div>
        <button type="button" className="btn btn-primary btn-block" onClick={function () { p.onConfirm(item, qty); }}>
          <Icon name="bag" size={18} /> {p.inCart > 0 ? "Mettre à jour le panier" : "Ajouter au panier"}
        </button>
      </div>
    );
    return (
      <Sheet title="Détail du produit" onClose={p.onClose} footer={footer}>
        <Img className="pd-img" src={item.image} alt={item.name} w={900} eager />
        {p.catName ? <span className="pd-cat">{p.catName}</span> : null}
        <h3 className="pd-name">{item.name}</h3>
        <div className="pd-price">{formatMoney(item.price, p.currency)}</div>
        {item.description ? <p className="pd-desc">{item.description}</p> : null}

        {soldOut ? <div className="note warn" style={{ marginTop: 12 }}>Ce produit est en rupture de stock.</div> : null}
      </Sheet>
    );
  }

  function CartSheet(p) {
    var o = p.order;
    var setField = function (k, v) { var n = Object.assign({}, o); n[k] = v; p.setOrder(n); };

    if (p.done) {
      return (
        <Sheet title="Commande" onClose={p.onClose} footer={<button type="button" className="btn btn-primary btn-block" onClick={p.onClose}>Fermer</button>}>
          <div className="done">
            <div className="d-ico"><Icon name="check" size={36} /></div>
            <h3>Commande envoyée !</h3>
            <p>Le vendeur a été prévenu. Vous retrouverez cette commande dans votre historique SOG.</p>
          </div>
        </Sheet>
      );
    }

    var footer = null;
    if (p.lines.length > 0) {
      footer = (
        <div>
          {p.error ? <div className="note err" role="alert">{p.error}</div> : null}
          <div className="total-row"><span>Total</span><span>{formatMoney(p.total, p.currency)}</span></div>
          <button type="button" className="btn btn-primary btn-block" onClick={p.onSubmit} disabled={p.busy || !p.sogUser}>

                      <div className="line-bot">
                        <Stepper small qty={l.qty} max={maxQty(l.p)} onDec={function () { p.onQty(l.p, l.qty - 1); }} onInc={function () { p.onQty(l.p, l.qty + 1); }} />
                        <span className="line-total">{formatMoney(l.p.price * l.qty, p.currency)}</span>
                      </div>
                    </div>
                  </div>

            {p.sogUser ? (

                  <textarea id="o-comments" className="input" rows="2" value={o.comments} onChange={function (e) { setField("comments", e.target.value); }} />

  function ProductForm(p) {
    var it = p.item;
    var [name, setName] = useState(it ? it.name : "");
    var [price, setPrice] = useState(it ? String(it.price) : "");
    var [stock, setStock] = useState(it && it.stock !== null ? String(it.stock) : "");
    var [categoryId, setCategoryId] = useState(String(it ? it.categoryId : (p.defaultCategoryId || (p.categories[0] ? p.categories[0].id : ""))));
    var [description, setDescription] = useState(it ? it.description : "");
    var [image, setImage] = useState(it ? it.image : "");
    var [err, setErr] = useState("");

    var submit = function (e) {
      e.preventDefault();
      if (!name.trim()) { setErr("Le nom du produit est obligatoire."); return; }
      var pr = Number(String(price).replace(",", "."));
      if (price === "" || isNaN(pr) || pr < 0) { setErr("Indiquez un prix valide."); return; }
      if (!p.categories.length) { setErr("Créez d'abord une catégorie (onglet Catégories)."); return; }
      if (!categoryId) { setErr("Choisissez une catégorie."); return; }
      p.onSave({
        name: name.trim(), price: pr, image: safeUrl(image), categoryId: Number(categoryId),
        stock: parseStock(stock), description: description.trim()
      });
    };

    return (
      <Sheet title={it ? "Modifier le produit" : "Nouveau produit"} onClose={p.onClose}
        footer={<button type="submit" form="product-form" className="btn btn-primary btn-block">{it ? "Enregistrer" : "Ajouter le produit"}</button>}>
        <form id="product-form" onSubmit={submit}>
          {err ? <div className="note err" role="alert">{err}</div> : null}
          <Field id="p-img" label="Photo"><ImageField value={image} onChange={setImage} onError={setErr} /></Field>
          <Field id="p-name" label="Nom *"><input id="p-name" className="input" value={name} onChange={function (e) { setName(e.target.value); }} /></Field>
          <div className="row2">
            <Field id="p-price" label={"Prix (" + p.currency + ") *"}><input id="p-price" className="input" type="number" inputMode="decimal" step="0.01" min="0" value={price} onChange={function (e) { setPrice(e.target.value); }} /></Field>
            <Field id="p-stock" label="Stock"><input id="p-stock" className="input" type="number" inputMode="numeric" min="0" placeholder="Illimité" value={stock} onChange={function (e) { setStock(e.target.value); }} /></Field>
          </div>
          <div className="hint" style={{ marginTop: -6, marginBottom: 14 }}>Laissez le stock vide pour ne pas limiter les ventes.</div>
          <Field id="p-cat" label="Catégorie *">
            {p.categories.length ? (
              <select id="p-cat" className="input" value={categoryId} onChange={function (e) { setCategoryId(e.target.value); }}>
                {p.categories.map(function (c) { return <option key={c.id} value={c.id}>{c.name}</option>; })}
              </select>
            ) : <div className="note warn">Aucune catégorie. Créez-en une dans l'onglet Catégories.</div>}
          </Field>
          <Field id="p-desc" label="Description (facultatif)"><textarea id="p-desc" className="input" rows="3" value={description} onChange={function (e) { setDescription(e.target.value); }} /></Field>
        </form>
      </Sheet>
    );
  }

  // =========================================================
  // APPLICATION
  // =========================================================
  function App() {
    var VENDOR = "toutou";
    var isPlaceholder = VENDOR.indexOf("{{") === 0;
    var demoMode = isPlaceholder;

    var params = new URLSearchParams(window.location.search);
    var pathRepo = window.location.pathname.split("/")[1] || "";
    var deducedVendor = pathRepo.indexOf("hanout-") === 0 ? pathRepo.slice(7) : null;
    var vendeur = demoMode ? "demo" : (params.get("vendeur") || deducedVendor || lsGet("vendeur_name") || VENDOR);
    var repoName = pathRepo.indexOf("hanout-") === 0 ? pathRepo : "hanout-" + vendeur;
    var cartKey = "cart_" + repoName;
    var tokenKey = "fgt_token_" + repoName;

    // ---- états ----
    var [loadState, setLoadState] = useState("loading");
    var [loadError, setLoadError] = useState("");
    var [data, setData] = useState(null);
    var [editable, setEditable] = useState(null);

    var [sogUser, setSogUser] = useState(null);
    var [sogChecked, setSogChecked] = useState(!IN_FRAME);
    var [firebaseUser, setFirebaseUser] = useState(null);
    var [isAdmin, setIsAdmin] = useState(false);

    var [view, setView] = useState("shop");
    var [adminTab, setAdminTab] = useState("products");
    var [token, setToken] = useState(function () { return lsGet(tokenKey) || ""; });
    var [isSaving, setIsSaving] = useState(false);

    var [search, setSearch] = useState("");
    var [catId, setCatId] = useState(null);
    var [detailId, setDetailId] = useState(null);
    var [cartOpen, setCartOpen] = useState(false);
    var [cart, setCart] = useState(function () {
      try {
        var raw = JSON.parse(lsGet(cartKey) || "[]");
        return Array.isArray(raw) ? raw.filter(function (l) { return l && l.id && l.qty > 0; }) : [];
      } catch (e) { return []; }
    });
    var [order, setOrder] = useState({ name: "", address: "", phone: "", comments: "" });
    var [orderError, setOrderError] = useState("");
    var [orderDone, setOrderDone] = useState(false);
    var [isOrdering, setIsOrdering] = useState(false);

    var [loginOpen, setLoginOpen] = useState(false);
    var [loginBusy, setLoginBusy] = useState(false);
    var [loginError, setLoginError] = useState("");
    var [loginInfo, setLoginInfo] = useState("");

    var [form, setForm] = useState(null);       // { type, item }
    var [confirm, setConfirm] = useState(null); // { title, text, yesLabel, danger, onYes }
    var [toast, setToast] = useState(null);
    var toastTimer = useRef(null);

    var notify = function (text, type) {
      setToast({ text: text, type: type || "info" });
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(function () { setToast(null); }, 3800);
    };

    // ---- chargement du catalogue ----
    var loadCatalog = async function (withToken) {
      if (demoMode) {
        var demo = normalizeCatalog(DEMO_RAW, "demo");
        setData(demo); setEditable(clone(demo)); setLoadState("ready");
        return;
      }
      var res = await fetchCatalog(repoName, withToken ? token : "");
      if (res.status === "error") { setLoadError(res.message || "Erreur réseau"); setLoadState("error"); return; }
      var cat = normalizeCatalog(res.status === "ok" ? res.json : null, vendeur);
      setData(cat); setEditable(clone(cat)); setLoadState("ready");
    };
    useEffect(function () { loadCatalog(false); }, []);

    // ---- thème + titre ----
    var themeAccent = view === "admin" && editable ? editable.settings.accent : (data ? data.settings.accent : "#0f766e");
    useEffect(function () { applyTheme(themeAccent); }, [themeAccent]);
    useEffect(function () { if (data) document.title = data.settings.title; }, [data && data.settings.title]);

    // ---- authentification Firebase (vendeur) ----
    useEffect(function () {
      if (demoMode) return;
      var unsub = auth.onAuthStateChanged(function (user) {
        if (user) {
          setFirebaseUser(user);
          db.ref("vendors/" + vendeur).once("value").then(function (snap) {
            var v = snap.val();
            setIsAdmin(!!(v && v.uid === user.uid));
          }).catch(function () { setIsAdmin(false); });
        } else {
          setFirebaseUser(null);
          setIsAdmin(false);
        }
      });
      return function () { unsub(); };
    }, [vendeur]);
    useEffect(function () { if (!isAdmin && view === "admin") setView("shop"); }, [isAdmin]);

    // ---- authentification SOG (iframe parent) ----
    useEffect(function () {
      var onMessage = function (event) {
        if (event.source !== window.parent || !event.data || event.data.type !== "SOG_AUTH") return;
        var u = event.data.payload && event.data.payload.user;
        var cleaned = null;
        if (u) {
          cleaned = Object.assign({}, u);
          Object.keys(cleaned).forEach(function (k) { if (typeof cleaned[k] === "string") cleaned[k] = decodeEntities(cleaned[k]); });
        }
        setSogUser(cleaned);
        setSogChecked(true);
      };
      window.addEventListener("message", onMessage);
      var t = null;
      if (IN_FRAME) {
        window.parent.postMessage({ type: "SOG_READY" }, "*");
        t = setTimeout(function () { setSogChecked(true); }, 1500);
      }
      return function () { window.removeEventListener("message", onMessage); clearTimeout(t); };
    }, []);

    // ---- préremplissage de la commande ----
    useEffect(function () {
      if (!sogUser) return;
      setOrder(function (o) {
        return {
          name: o.name || sogUser.name || "",
          phone: o.phone || sogUser.phone || "",
          address: o.address || sogUser.address || "",
          comments: o.comments
        };
      });
    }, [sogUser]);

    // ---- panier persistant ----
    useEffect(function () { lsSet(cartKey, JSON.stringify(cart)); }, [cart]);

    // ---- blocage du défilement quand une feuille est ouverte ----
    var anyOverlay = !!(detailId !== null || cartOpen || loginOpen || form || confirm);
    useEffect(function () {
      document.body.style.overflow = anyOverlay ? "hidden" : "";
      return function () { document.body.style.overflow = ""; };
    }, [anyOverlay]);

    // ---- panier ----
    var productsById = {};
    if (data) data.products.forEach(function (p) { productsById[p.id] = p; });
    var lines = cart.map(function (l) {
      var p = productsById[l.id];
      return p ? { p: p, qty: Math.min(l.qty, Math.max(1, maxQty(p))) } : null;
    }).filter(function (l) { return l && !isSoldOut(l.p); });
    var cartCount = lines.reduce(function (s, l) { return s + l.qty; }, 0);
    var cartTotal = lines.reduce(function (s, l) { return s + l.p.price * l.qty; }, 0);
    var qtyOf = function (id) { var l = lines.find(function (x) { return x.p.id === id; }); return l ? l.qty : 0; };

    var setLineQty = function (product, qty) {
      var q = Math.min(qty, maxQty(product));
      if (qty > maxQty(product)) notify("Stock insuffisant.", "error");
      setCart(function (prev) {
        var rest = prev.filter(function (l) { return l.id !== product.id; });
        return q > 0 ? rest.concat([{ id: product.id, qty: q }]) : rest;
      });
    };

    // ---- commande ----
    var submitOrder = async function () {
      setOrderError("");
      if (demoMode) { setOrderError("Mode démo : aucune commande n'est envoyée."); return; }
      if (!sogUser) { setOrderError("Connectez-vous à SOG pour valider la commande."); return; }
      if (!lines.length) return;
      var name = order.name.trim(), address = order.address.trim(), phone = order.phone.trim();
      if (!name || !address || !phone) { setOrderError("Merci de remplir le nom, le téléphone et l'adresse."); return; }
      if (phone.replace(/\D/g, "").length < 8) { setOrderError("Le numéro de téléphone semble invalide."); return; }

      var currency = data.settings.currency;
      var items = lines.map(function (l) { return { name: l.p.name, quantity: l.qty, price: l.p.price }; });
      setIsOrdering(true);
      try {
        await db.ref("orders").push({
          userId: sogUser.uid,
          customerEmail: sogUser.email,
          vendor: vendeur,
          items: items,
          total: cartTotal,
          currency: currency,
          status: "pending",
          createdAt: new Date().toISOString(),
          customerName: name,
          customerPhone: phone,
          customerAddress: address,
          comments: order.comments.trim()
        });
      } catch (err) {
        setOrderError("L'enregistrement de la commande a échoué. Vérifiez votre connexion puis réessayez.");
        setIsOrdering(false);
        return;
      }

      // Demande à SOG de recharger l'historique du client
      if (IN_FRAME) window.parent.postMessage({ type: "SOG_ORDER_SAVED", payload: { userId: sogUser.uid, email: sogUser.email } }, "*");

      // Notification au vendeur (ntfy)
      var topic = data.settings.ntfyTopic;
      if (topic) {
        var msg = "RÉCAPITULATIF\n\nClient : " + name + "\nAdresse : " + address + "\nTél : " + phone +
          "\nRemarque : " + (order.comments.trim() || "Aucune") + "\n\n----------------\n\nArticles commandés :\n" +
          items.map(function (i) { return "  " + i.name + " x" + i.quantity + " = " + (i.price * i.quantity).toFixed(2) + " " + currency; }).join("\n") +
          "\n\n----------------\n\nTOTAL : " + cartTotal.toFixed(2) + " " + currency;
        fetch("https://ntfy.sh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: topic, title: "NOUVELLE COMMANDE", message: msg, priority: 5, tags: ["shopping_cart"] })
        }).catch(function () {});
      }

      setCart([]);
      setOrder(function (o) { return Object.assign({}, o, { comments: "" }); });
      setOrderDone(true);
      setIsOrdering(false);
    };
    var closeCart = function () { setCartOpen(false); setOrderDone(false); setOrderError(""); };

    // ---- connexion vendeur ----
    var openLogin = function () { setLoginError(""); setLoginInfo(""); setLoginOpen(true); };
    var openAdmin = async function () {
      setView("admin");
      setAdminTab("products");
      window.scrollTo(0, 0);
      if (token) { await loadCatalog(true); }   // version la plus récente avant modification
    };
    var handleAdminButton = function () { if (firebaseUser && isAdmin) openAdmin(); else openLogin(); };
    var handleLogin = async function (email, password) {
      setLoginError(""); setLoginInfo(""); setLoginBusy(true);
      try {
        var cred = await auth.signInWithEmailAndPassword(email, password);
        var snap = await db.ref("vendors/" + vendeur).once("value");
        var v = snap.val();
        if (v && v.uid === cred.user.uid) {
          setLoginOpen(false);
          openAdmin();
        } else {
          setLoginError("Ce compte n'est pas le vendeur de cette boutique.");
        }
      } catch (error) {
        var c = error.code || "";
        var m = "Connexion impossible. Réessayez.";
        if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found") m = "Email ou mot de passe incorrect.";
        else if (c === "auth/invalid-email") m = "Adresse email invalide.";
        else if (c === "auth/too-many-requests") m = "Trop de tentatives. Patientez quelques minutes.";
        else if (c === "auth/network-request-failed") m = "Pas de connexion internet.";
        setLoginError(m);
      }
      setLoginBusy(false);
    };
    var handleReset = function (email) {
      setLoginError(""); setLoginInfo("");
      if (!email) { setLoginError("Saisissez d'abord votre email."); return; }
      auth.sendPasswordResetEmail(email)
        .then(function () { setLoginInfo("Email de réinitialisation envoyé à " + email + "."); })
        .catch(function () { setLoginError("Impossible d'envoyer l'email de réinitialisation."); });
    };
    var handleLogout = function () {
      auth.signOut().then(function () { setView("shop"); notify("Déconnecté.", "info"); });
    };

    // ---- édition du catalogue ----
    var dirty = !!(data && editable) && JSON.stringify(data) !== JSON.stringify(editable);
    var changeCount = dirty ? countChanges(data, editable) : 0;

    var leaveAdmin = function () {
      if (!dirty) { setView("shop"); return; }
      setConfirm({
        title: "Quitter sans enregistrer ?", text: "Vos modifications non enregistrées seront perdues.",
        yesLabel: "Quitter", danger: true,
        onYes: function () { setEditable(clone(data)); setConfirm(null); setView("shop"); }
      });
    };
    var setSetting = function (k, v) {
      setEditable(function (prev) { var s = Object.assign({}, prev.settings); s[k] = v; return Object.assign({}, prev, { settings: s }); });
    };
    var nextId = function (list) { return list.reduce(function (m, x) { return Math.max(m, x.id); }, 0) + 1; };

    var saveProductForm = function (vals) {
      var item = form.item;
      setEditable(function (prev) {
        var products = prev.products.slice();
        if (item) {
          var i = products.findIndex(function (x) { return x.id === item.id; });
          if (i > -1) products[i] = Object.assign({ id: item.id }, vals);
        } else {
          products.push(Object.assign({ id: nextId(products) }, vals));
        }
        return Object.assign({}, prev, { products: products });
      });
      setForm(null);
    };
    var saveCategoryForm = function (vals) {
      var item = form.item;
      setEditable(function (prev) {
        var categories = prev.categories.slice();
        if (item) {
          var i = categories.findIndex(function (x) { return x.id === item.id; });
          if (i > -1) categories[i] = { id: item.id, name: vals.name };
        } else {
          categories.push({ id: nextId(categories), name: vals.name });
        }
        return Object.assign({}, prev, { categories: categories });
      });
      setForm(null);
    };
    var deleteProduct = function (p) {
      setConfirm({
        title: "Supprimer ce produit ?", text: "« " + p.name + " » sera retiré du catalogue après l'enregistrement.",
        yesLabel: "Supprimer", danger: true,
        onYes: function () {
          setEditable(function (prev) { return Object.assign({}, prev, { products: prev.products.filter(function (x) { return x.id !== p.id; }) }); });
          setConfirm(null);
        }
      });
    };
    var deleteCategory = function (c) {
      var n = editable.products.filter(function (x) { return x.categoryId === c.id; }).length;
      setConfirm({
        title: "Supprimer cette catégorie ?",
        text: n ? "Les " + n + " produit" + (n > 1 ? "s" : "") + " de « " + c.name + " » seront aussi supprimés." : "« " + c.name + " » sera supprimée.",
        yesLabel: "Supprimer", danger: true,
        onYes: function () {
          setEditable(function (prev) {
            return Object.assign({}, prev, {
              categories: prev.categories.filter(function (x) { return x.id !== c.id; }),
              products: prev.products.filter(function (x) { return x.categoryId !== c.id; })
            });
          });
          setConfirm(null);
        }
      });
    };
    var saveToken = function (value) {
      if (!value) { notify("Saisissez un token valide.", "error"); return; }
      lsSet(tokenKey, value);
      setToken(value);
      notify("Token enregistré sur cet appareil.", "success");
    };
    var saveCatalog = async function () {
      if (!token) { setAdminTab("settings"); notify("Ajoutez d'abord le token GitHub (onglet Réglages).", "error"); return; }
      setIsSaving(true);
      try {
        var payload = serializeCatalog(editable);
        await githubSave(repoName, token, payload);
        setData(clone(editable));
        notify("Enregistré. Les clients verront les changements d'ici 1 à 2 minutes.", "success");
      } catch (err) {
        notify("Échec de l'enregistrement : " + err.message, "error");
      }
      setIsSaving(false);
    };

    // =========================================================
    // RENDU
    // =========================================================
    var rootClass = "app" + (IN_FRAME ? " in-frame" : "");
    var shopTitle = data ? data.settings.title : "Boutique";

    var header = (
      <header className="topbar">
        <div className="topbar-in">
          {view === "admin" ? (
            <button type="button" className="icon-btn" aria-label="Retour à la boutique" onClick={leaveAdmin}><Icon name="back" /></button>
          ) : null}
          <div className="brand">
            {view === "shop" ? (
              data && data.settings.logo
                ? <Img className="brand-logo" src={data.settings.logo} alt="" w={96} eager />
                : <span className="brand-mark" aria-hidden="true">{shopTitle.charAt(0).toUpperCase()}</span>
            ) : null}
            <span className="brand-name">{view === "admin" ? "Administration" : shopTitle}</span>
          </div>
          {view === "shop" ? (
            <div style={{ display: "flex", gap: 2 }}>
              {!demoMode ? (
                <button type="button" className="icon-btn" aria-label={isAdmin ? "Gérer la boutique" : "Espace vendeur"} onClick={handleAdminButton}>
                  <Icon name={isAdmin ? "sliders" : "lock"} size={20} />
                </button>
              ) : null}
              <button type="button" className="icon-btn" aria-label={"Panier, " + cartCount + " article(s)"} onClick={function () { setCartOpen(true); }}>
                <Icon name="bag" />
                {cartCount > 0 ? <span className="badge">{cartCount}</span> : null}
              </button>
            </div>
          ) : (
            <button type="button" className="icon-btn" aria-label="Se déconnecter" onClick={handleLogout}><Icon name="logout" size={20} /></button>
          )}
        </div>
      </header>
    );

    // ---- états de chargement / erreur ----
    if (loadState === "loading") {
      return (
        <div className={rootClass}>
          {header}
          <div className="container page">
            <div className="grid">
              {[1, 2, 3, 4, 5, 6].map(function (i) {
                return <div className="skel-card" key={i}><div className="skel"></div><div className="skel skel-line"></div><div className="skel skel-line s"></div></div>;
              })}
            </div>
          </div>
        </div>
      );
    }
    if (loadState === "error") {
      return (
        <div className={rootClass}>
          {header}
          <div className="container page">
            <Empty icon="alert" title="Chargement impossible" text={"Le catalogue n'a pas pu être chargé (" + loadError + ")."}
              action={<button type="button" className="btn btn-primary" onClick={function () { setLoadState("loading"); loadCatalog(false); }}>Réessayer</button>} />
          </div>
        </div>
      );
    }

    var settings = data.settings;
    var currency = settings.currency;
    var catNameOf = function (id) { var c = data.categories.find(function (x) { return x.id === id; }); return c ? c.name : ""; };

    // ---- produits filtrés (en stock d'abord) ----
    var q = fold(search.trim());
    var filtered = data.products.filter(function (p) {
      if (catId !== null && p.categoryId !== catId) return false;
      if (q && fold(p.name + " " + p.description + " " + catNameOf(p.categoryId)).indexOf(q) === -1) return false;
      return true;
    });
    filtered = filtered.filter(function (p) { return !isSoldOut(p); }).concat(filtered.filter(isSoldOut));
    var visibleCats = data.categories.filter(function (c) { return data.products.some(function (p) { return p.categoryId === c.id; }); });

    var dockVisible = (view === "shop" && cartCount > 0) || (view === "admin" && dirty);
    var toastBottom = "calc(" + (dockVisible ? 84 : 16) + "px + var(--safe-bottom))";

    var detailItem = detailId !== null ? productsById[detailId] : null;

    return (
      <div className={rootClass}>
        {header}

        {view === "shop" ? (
          <div>
            <div className="container">
              <div className="hero">
                <div className="hero-card">
                  <div className="hero-title">{settings.tagline || "Parcourez le catalogue et commandez en quelques clics."}</div>
                  <div className="hero-chips">
                    <span className="hero-chip">{data.products.length} produit{data.products.length > 1 ? "s" : ""}</span>
                    {demoMode ? <span className="hero-chip">Aperçu du template</span>
                      : sogUser ? <span className="hero-chip"><Icon name="check" size={14} /> {sogUser.name || "Connecté"}</span>
                      : sogChecked ? <span className="hero-chip">Mode invité</span> : null}
                  </div>
                  {!sogUser && sogChecked && !demoMode ? (
                    <div className="hero-sub">
                      {IN_FRAME ? "Connectez-vous depuis l'accueil SOG pour commander." : "Cette boutique se commande depuis l'application SOG."}
                      {!IN_FRAME ? <span> <a href={SOG_URL} style={{ color: "inherit", fontWeight: 700 }}>Ouvrir SOG</a></span> : null}
                    </div>
                  ) : null}
                </div>
                <div className="search">
                  <span className="s-icon"><Icon name="search" size={20} /></span>
                  <input type="search" enterKeyHint="search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit" value={search} onChange={function (e) { setSearch(e.target.value); }} />
                  {search ? <button type="button" className="s-clear" aria-label="Effacer la recherche" onClick={function () { setSearch(""); }}><Icon name="x" size={18} /></button> : null}
                </div>
              </div>
            </div>

            {visibleCats.length > 0 ? (
              <div className="chips-wrap">
                <div className="chips" role="tablist" aria-label="Catégories">
                  <button type="button" className={"chip" + (catId === null ? " on" : "")} onClick={function () { setCatId(null); }}>Tous</button>
                  {visibleCats.map(function (c) {
                    return <button key={c.id} type="button" className={"chip" + (catId === c.id ? " on" : "")} onClick={function () { setCatId(c.id); }}>{c.name}</button>;
                  })}
                </div>
              </div>
            ) : null}

            <main className={"container page" + (dockVisible ? " has-dock" : "")}>
              {filtered.length === 0 ? (
                <Empty icon={search ? "search" : "bag"}
                  title={search ? "Aucun résultat" : "Aucun produit pour le moment"}
                  text={search ? "Essayez un autre mot-clé ou une autre catégorie." : "Revenez bientôt, le catalogue se remplit."}
                  action={search || catId !== null ? <button type="button" className="btn btn-soft" onClick={function () { setSearch(""); setCatId(null); }}>Voir tout le catalogue</button> : null} />
              ) : (
                <div className="grid">
                  {filtered.map(function (p) {
                    return (
                      <ProductCard key={p.id} item={p} currency={currency} showStock={settings.showStock}
                        catName={catId === null ? catNameOf(p.categoryId) : ""} qty={qtyOf(p.id)}
                        onOpen={setDetailId} onQty={setLineQty} />
                    );
                  })}
                </div>
              )}
              <div className="footer">{shopTitle} · Propulsé par SOG</div>
            </main>
          </div>
        ) : (
          <AdminView
            tab={adminTab} setTab={setAdminTab} editable={editable} original={data} dirty={dirty}
            token={token} repoName={repoName}
            onSetting={setSetting} onSaveToken={saveToken} notify={notify} onLogout={handleLogout}
            onEditProduct={function (item) { setForm({ type: "product", item: item }); }}
            onEditCategory={function (item) { setForm({ type: "category", item: item }); }}
            onDeleteProduct={deleteProduct} onDeleteCategory={deleteCategory}
          />
        )}

        {/* ---- barre basse ---- */}
        {view === "shop" && cartCount > 0 ? (
          <div className="dock">
            <button type="button" className="dock-btn" onClick={function () { setCartOpen(true); }}>
              <span className="dock-l"><Icon name="bag" size={22} /> Voir le panier ({cartCount})</span>
              <span>{formatMoney(cartTotal, currency)}</span>
            </button>
          </div>
        ) : null}
        {view === "admin" && dirty ? (
          <div className="dock">
            <button type="button" className="dock-btn" onClick={saveCatalog} disabled={isSaving}>
              <span className="dock-l"><Icon name="check" size={22} /> {isSaving ? "Enregistrement…" : "Enregistrer"}</span>
              <span>{changeCount} modification{changeCount > 1 ? "s" : ""}</span>
            </button>
          </div>
        ) : null}

        {/* ---- feuilles ---- */}
        {detailItem ? (
          <ProductSheet item={detailItem} currency={currency} showStock={settings.showStock} catName={catNameOf(detailItem.categoryId)}
            inCart={qtyOf(detailItem.id)} onClose={function () { setDetailId(null); }}
            onConfirm={function (item, qty) { setLineQty(item, qty); setDetailId(null); }} />
        ) : null}

        {cartOpen ? (
          <CartSheet lines={lines} total={cartTotal} currency={currency} sogUser={sogUser}
            order={order} setOrder={setOrder} error={orderError} busy={isOrdering} done={orderDone}
            onQty={setLineQty} onSubmit={submitOrder} onClose={closeCart} />
        ) : null}

        {loginOpen ? (
          <LoginSheet busy={loginBusy} error={loginError} info={loginInfo} onSubmit={handleLogin} onReset={handleReset} onClose={function () { setLoginOpen(false); }} />
        ) : null}

        {form && form.type === "product" ? (
          <ProductForm item={form.item} categories={editable.categories} currency={editable.settings.currency}
            defaultCategoryId={null} onSave={saveProductForm} onClose={function () { setForm(null); }} />
        ) : null}
        {form && form.type === "category" ? (
          <CategoryForm item={form.item} onSave={saveCategoryForm} onClose={function () { setForm(null); }} />
        ) : null}

        {confirm ? (
          <Confirm title={confirm.title} text={confirm.text} yesLabel={confirm.yesLabel} danger={confirm.danger}
            onYes={confirm.onYes} onNo={function () { setConfirm(null); }} />
        ) : null}

        {/* ---- message (masqué quand une feuille est ouverte : les erreurs s'affichent alors dans la feuille) ---- */}
        {toast && !anyOverlay ? (
          <div className="toasts" style={{ bottom: toastBottom }} role="status" aria-live="polite">
            <div className={"toast " + toast.type}>{toast.text}</div>
          </div>
        ) : null}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
